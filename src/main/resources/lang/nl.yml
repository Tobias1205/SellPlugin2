# SellPlugin - Nederlands
# Tags zoals <green> en placeholders zoals {money} niet aanpassen / do not change tags and {placeholders}.
# Kleine hoofdletters in de menu's worden automatisch toegepast (zie small-caps in config.yml).
# <theme>...</theme> = kleurverloop uit config.yml (theme-colors). Verhoog lang-version niet zelf.

lang-version: 5

categories:
  crops: "Gewassen"
  ores: "Erts"
  mobs: "Mob-drops"
  natural: "Natuur"
  tools: "Pantser & Gereedschap"
  fish: "Vis"
  books: "Betoverde boeken"
  potions: "Drankjes"
  blocks: "Blokken"

worth-lore:
  format: "<!italic><gray>Waarde <green>${price}"

gui:
  sell-title: "<dark_gray>verkopen"
  worth-title: "<dark_gray>itemprijzen"
  progress-menu-title: "<dark_gray>{category} <dark_gray>voortgang"
  items-title: "<dark_gray>{category} <dark_gray>items ({page}/{pages})"
  worth-items-title: "<dark_gray>{category} <dark_gray>prijzen ({page}/{pages})"
  search-title: "<dark_gray>zoeken: {query} ({page}/{pages})"
  history-title: "<dark_gray>verkoopgeschiedenis ({page}/{pages})"
  multiplier-line: "<!italic><gray>Multiplier: <green>x{multiplier}"
  sold-line: "<!italic><gray>Verkocht: <green>${sold}"
  next-line: "<!italic><gray>Volgend niveau: <green>x{next} <gray>bij <green>${needed}"
  max-line: "<!italic><green>Hoogste niveau bereikt!"
  progress-line: "<!italic>{bar} <white>{percent}%"
  click-line: "<!italic><yellow>Klik voor het overzicht"
  items-click-line: "<!italic><yellow>Klik om alle items te zien"
  level-reached: "<!italic><green>x{multiplier} behaald"
  level-current: "<!italic><yellow>x{multiplier} <gray>(bezig)"
  level-locked: "<!italic><gray>x{multiplier}"
  level-from: "<!italic><gray>Vanaf <green>${needed} <gray>verkocht"
  level-remaining: "<!italic><gray>Nog <green>${remaining} <gray>te gaan"
  back: "<!italic><red>Terug"
  back-overview: "<!italic><red>Terug"
  back-worth: "<!italic><red>Terug"
  close: "<!italic><red>Sluiten"
  prev: "<!italic><yellow>Vorige pagina"
  next: "<!italic><yellow>Volgende pagina"
  page-info: "<!italic><gray>Pagina <white>{page}<gray>/<white>{pages}"
  potion-note: "<!italic><dark_gray>Verlengd, versterkt en splash zijn meer waard"
  history-entry-name: "<!italic><yellow>#{number} <dark_gray>- <gray>{date}"
  history-money: "<!italic><gray>Verdiend: <green>${money}"
  history-items: "<!italic><gray>Items: <white>{items}"
  history-mult: "<!italic><gray>Multiplier: <green>x{multiplier}"
  history-top-header: "<!italic><gray>Meest waard:"
  history-top-line: "<!italic><dark_gray>- <white>{count}x <gray>{item}"
  history-summary-name: "<!italic><yellow>Totaal"
  history-summary-total: "<!italic><gray>Totaal verdiend: <green>${money}"
  history-summary-sales: "<!italic><gray>Aantal verkopen: <white>{sales}"
  history-empty: "<!italic><gray>Nog niets verkocht"

messages:
  sold: "<theme>Je hebt {items} items verkocht voor </theme><#00AA00>${money}</#00AA00>"
  category-levelup: "<theme><bold>NIEUW NIVEAU!</bold> </theme><white>{category}</white> <theme>multiplier is nu x{progress}</theme>"
  no-permission: "<red>Geen permissie."
  reloaded: "<theme>Instellingen en prijzen herladen.</theme>"
  multipliers-header: "<theme>Jouw multipliers </theme><gray>(globaal x{global})"
  multiplier-line: "<gray>- {category}<gray>: <theme>x{multiplier} </theme><dark_gray>(niveau x{progress})"
  worth-hand: "<theme>{item}</theme> <gray>- Waarde <theme>${stack}</theme> <dark_gray>(x{multiplier})"
  not-sellable: "<red>Dit item kan niet verkocht worden."
  hold-item: "<red>Hou een item vast."
  global-set: "<theme>Globale multiplier staat nu op x{multiplier}.</theme>"
  usage-global: "<red>Gebruik: /sell global [getal]"
  worth-lookup: "<theme>{item}</theme> <gray>- Waarde <theme>${price}</theme> <dark_gray>({category}<dark_gray>, x{multiplier})"
  worth-special: "<theme>{item}</theme> <gray>- de prijs hangt af van het type. Kijk in <white>/worth</white> bij {category}"
  worth-none: "<red>Geen item gevonden met die naam."
  worth-many: "<gray>{count} items gevonden, wees specifieker. Bijvoorbeeld: <white>{list}"
  players-only: "<red>Alleen spelers kunnen dit gebruiken."
  usage-worth: "<red>Gebruik: /worth [item]"
  language-current: "<gray>Taal: <white>{language} <gray>(beschikbaar: <white>{list}<gray>)"
  language-set: "<theme>Taal ingesteld op </theme><white>{language}<theme>.</theme>"
  language-unknown: "<red>Onbekende taal. Beschikbaar: <white>{list}"
  status-title: "<theme>SellPlugin-status</theme>"
  status-packetevents: "<gray>PacketEvents gevonden: {state}"
  status-lore: "<gray>Waarde-info bij items actief: {state}"
  status-lore-count: "<gray>Items met waarde-info verstuurd: <white>{count}"
  status-owners: "<gray>/sell is van: <white>{sell} <gray>| /worth is van: <white>{worth}"
  status-last-error: "<gray>Laatste fout: <white>{error}"
  status-creative: "<gray>Jij in creatief (geen waarde-info): {state}"
  state-yes: "<green>ja"
  state-no: "<red>nee"
  state-no-install: "<red>nee (installeer PacketEvents)"
  creative-yes: "<red>ja, ga naar survival"
  creative-no: "<green>nee"

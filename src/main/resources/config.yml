# ---- Taal / Language ----
# Beschikbaar / available: nl, en, de, fr, es. Eigen taal? Kopieer plugins/SellPlugin/lang/en.yml
# naar bv. it.yml, vertaal de teksten en zet hier de code. Aanpassen kan ook in game: /sell language <code>
language: nl

# Themakleuren van de plugin in de chat (hexcodes met #). Met meerdere kleuren loopt de tekst over van de
# eerste naar de laatste kleur (kleurverloop). Met een enkele kleur wordt het een effen kleur.
# Wordt gebruikt voor bedragen, titels en accenten in chatberichten.
theme-colors:
  - "#FFB347"
  - "#FFA531"
  - "#FF981B"
  - "#FF8C00"

# Kleine hoofdletters (ᴅɪᴛ ʟᴇᴛᴛᴇʀᴛʏᴘᴇ) in de menu's en de Worth-tekst. Zet op false voor gewone letters.
small-caps: true

# Alle prijzen in prices.yml worden hiermee vermenigvuldigd (1.0 = ongewijzigd).
price-scale: 1.0

# Prijs voor items die nog niet in prices.yml staan (worden automatisch toegevoegd)
fallback-price: 1.0

# ---- Multiplier systeem ----
# Elke categorie heeft een eigen multiplier. Verkoop je veel items uit een
# categorie, dan stijgt alleen de multiplier van die categorie.
# Gerekend wordt met het totaal verkochte bedrag (zonder multiplier).
max-multiplier: 3.0

# LET OP: de levels staan nu in multipliers.yml. Deze lijst wordt alleen gebruikt voor categorieen die daar ontbreken.
# Levels per categorie: "totaal verkocht": multiplier
# x1.0 is het startpunt (het icoon bovenaan). Elk level hieronder is een glasplaatje op de kronkel
# in het progress-menu, dus houd het bij maximaal 20 levels (x1.1 t/m x3.0).
# De drempels worden per categorie vermenigvuldigd met "scale" (zie onder).
progress-levels:
  "0": 1.0
  "2500": 1.1
  "3500": 1.2
  "5000": 1.3
  "7500": 1.4
  "11000": 1.5
  "16000": 1.6
  "24000": 1.7
  "35000": 1.8
  "52000": 1.9
  "77000": 2.0
  "115000": 2.1
  "170000": 2.2
  "250000": 2.3
  "370000": 2.4
  "550000": 2.5
  "800000": 2.6
  "1200000": 2.7
  "1800000": 2.8
  "2700000": 2.9
  "4000000": 3.0

# De 9 categorieen (onderste rij van /sell). Waar elk item bij hoort staat in categories.yml.
# scale: 0.5 = drempels de helft lager (handig voor goedkope categorieen), 2 = dubbel zo hoog.
# Kleur van alle categorie-namen (MiniMessage tag, bv. <gray>, <yellow>, <gold>, <aqua>)
category-name-color: "<gray>"
default-category: blocks
categories:
  crops:
    icon: WHEAT
    scale: 0.5
  ores:
    icon: DIAMOND
    scale: 2.0
  mobs:
    icon: BONE
    scale: 0.5
  natural:
    icon: GRASS_BLOCK
    scale: 0.4
  tools:
    icon: SHIELD
    scale: 1.5
  fish:
    icon: COD
    scale: 0.5
  books:
    icon: ENCHANTED_BOOK
    scale: 2.0
  potions:
    icon: BREWING_STAND
    scale: 1.0
  blocks:
    icon: BRICKS
    scale: 0.5

# ---- Enchanted books ----
# Prijs = (prijs per level van elke enchantment) x (level), bij elkaar opgeteld.
enchanted-books:
  default-per-level: 50
  prices:
    protection: 60
    fire_protection: 40
    feather_falling: 50
    blast_protection: 40
    projectile_protection: 40
    respiration: 50
    aqua_affinity: 80
    thorns: 60
    depth_strider: 70
    frost_walker: 120
    soul_speed: 120
    swift_sneak: 150
    binding_curse: 5
    sharpness: 70
    smite: 40
    bane_of_arthropods: 40
    knockback: 40
    fire_aspect: 80
    looting: 100
    sweeping_edge: 60
    efficiency: 70
    silk_touch: 400
    unbreaking: 90
    fortune: 150
    power: 70
    punch: 40
    flame: 100
    infinity: 400
    luck_of_the_sea: 80
    lure: 60
    loyalty: 70
    impaling: 70
    riptide: 100
    channeling: 150
    multishot: 150
    piercing: 50
    quick_charge: 70
    mending: 1500
    vanishing_curse: 5
    density: 80
    breach: 80
    wind_burst: 100

# ---- Items met enchants (zwaarden, armor, tools, bogen, enz.) ----
# Prijs = basisprijs + (som van prijs per level x level, uit de lijst hierboven) x factor.
# 1.0 = een enchant is op een item evenveel waard als op een boek, 0.5 = de helft.
enchanted-items:
  factor: 0.75

# ---- Potions ----
# Prijs van de basis-potion. "long_" (verlengd) en "strong_" (II) krijgen een extra factor.
potions:
  default-price: 10
  long-multiplier: 1.5
  strong-multiplier: 1.7
  splash-multiplier: 1.25
  lingering-multiplier: 2.5
  prices:
    water: 0.5
    mundane: 2
    thick: 2
    awkward: 3
    night_vision: 12
    invisibility: 15
    leaping: 10
    fire_resistance: 15
    swiftness: 12
    slowness: 10
    water_breathing: 12
    healing: 15
    harming: 12
    poison: 12
    regeneration: 20
    strength: 20
    weakness: 8
    luck: 30
    turtle_master: 40
    slow_falling: 20
    wind_charged: 15
    weaving: 15
    oozing: 15
    infested: 15

# Globale multiplier voor iedereen (bv. 2.0 voor een dubbel-geld event).
# Aanpasbaar in game met /sell global <x>
global-multiplier: 1.0

# Toont de waarde in de tooltip van items in je inventory (heeft PacketEvents nodig)
worth-lore:
  enabled: true
  # Wat er gebeurt met het item in je geselecteerde hotbar-slot terwijl je hakt:
  #   freeze = worth blijft zichtbaar, de waarde ververst pas als je stopt met hakken (aanbevolen)
  #   hide   = geen worth op het vastgehouden item
  #   normal = altijd direct bijwerken (hakken kan heel even resetten bij het oppakken van items)
  held-slot: freeze
  # Bij held-slot: freeze. Hoeveel milliseconden je moet stoppen met hakken voordat de worth van het
  # vastgehouden item bijgewerkt wordt. Lager = sneller bijwerken, maar een korte pauze tijdens
  # het hakken kan dan een reset geven. Loslaten van de muisknop werkt altijd direct bij.
  mining-idle-ms: 250

# Alle teksten in de menu's worden automatisch in kleine hoofdletters (ᴅɪᴛ ʟᴇᴛᴛᴇʀᴛʏᴘᴇ) getoond.
# Kleurenschema: titels dark_gray, labels gray, waardes green, acties yellow.
# Getallen kort tonen: 1500 = 1.5k, 2000000 = 2m, 3000000000 = 3b, 4000000000000 = 4t
number-format:
  short: true

history:
  max-entries: 200
  date-format: "dd-MM HH:mm"

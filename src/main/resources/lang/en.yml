# SellPlugin - English
# Tags zoals <green> en placeholders zoals {money} niet aanpassen / do not change tags and {placeholders}.
# Kleine hoofdletters in de menu's worden automatisch toegepast (zie small-caps in config.yml).

categories:
  crops: "Crops"
  ores: "Ores"
  mobs: "Mob Drops"
  natural: "Natural Items"
  tools: "Armor & Tools"
  fish: "Fish"
  books: "Enchanted Books"
  potions: "Potions"
  blocks: "Blocks"

worth-lore:
  format: "<!italic><gray>Worth <green>${price}"

gui:
  sell-title: "<dark_gray>sell"
  worth-title: "<dark_gray>item prices"
  progress-menu-title: "<dark_gray>{category} <dark_gray>progress"
  items-title: "<dark_gray>{category} <dark_gray>items ({page}/{pages})"
  worth-items-title: "<dark_gray>{category} <dark_gray>prices ({page}/{pages})"
  search-title: "<dark_gray>search: {query} ({page}/{pages})"
  history-title: "<dark_gray>sell history ({page}/{pages})"
  multiplier-line: "<!italic><gray>Multiplier: <green>x{multiplier}"
  sold-line: "<!italic><gray>Sold: <green>${sold}"
  next-line: "<!italic><gray>Next level: <green>x{next} <gray>at <green>${needed}"
  max-line: "<!italic><green>Max level reached!"
  progress-line: "<!italic>{bar} <white>{percent}%"
  click-line: "<!italic><yellow>Click for the overview"
  items-click-line: "<!italic><yellow>Click to see all items"
  level-reached: "<!italic><green>x{multiplier} reached"
  level-current: "<!italic><yellow>x{multiplier} <gray>(in progress)"
  level-locked: "<!italic><gray>x{multiplier}"
  level-from: "<!italic><gray>From <green>${needed} <gray>sold"
  level-remaining: "<!italic><green>${remaining} <gray>to go"
  back: "<!italic><red>Back"
  back-overview: "<!italic><red>Back"
  back-worth: "<!italic><red>Back"
  close: "<!italic><red>Close"
  prev: "<!italic><yellow>Previous page"
  next: "<!italic><yellow>Next page"
  page-info: "<!italic><gray>Page <white>{page}<gray>/<white>{pages}"
  potion-note: "<!italic><dark_gray>Extended, upgraded and splash are worth more"
  history-entry-name: "<!italic><yellow>#{number} <dark_gray>- <gray>{date}"
  history-money: "<!italic><gray>Earned: <green>${money}"
  history-items: "<!italic><gray>Items: <white>{items}"
  history-mult: "<!italic><gray>Multiplier: <green>x{multiplier}"
  history-top-header: "<!italic><gray>Most valuable:"
  history-top-line: "<!italic><dark_gray>- <white>{count}x <gray>{item}"
  history-summary-name: "<!italic><yellow>Total"
  history-summary-total: "<!italic><gray>Total earned: <green>${money}"
  history-summary-sales: "<!italic><gray>Sales: <white>{sales}"
  history-empty: "<!italic><gray>Nothing sold yet"

messages:
  sold: "<green>You sold <white>{items}</white> items for <yellow>${money}</yellow> <gray>(x{multiplier})"
  category-levelup: "<gold><bold>LEVEL UP!</bold> <white>{category}</white> <yellow>multiplier is now x{progress}</yellow>"
  no-permission: "<red>No permission."
  reloaded: "<green>Config and prices reloaded."
  multipliers-header: "<green>Your multipliers <gray>(global x{global})"
  multiplier-line: "<gray>- {category}<gray>: <yellow>x{multiplier} <dark_gray>(level x{progress})"
  worth-hand: "<yellow>{item}</yellow> <gray>- Worth <green>${stack}</green> <dark_gray>(x{multiplier})"
  not-sellable: "<red>This item cannot be sold."
  hold-item: "<red>Hold an item."
  global-set: "<green>Global multiplier is now x{multiplier}."
  usage-global: "<red>Usage: /sell global [number]"
  worth-lookup: "<yellow>{item}</yellow> <gray>- Worth <green>${price}</green> <dark_gray>({category}<dark_gray>, x{multiplier})"
  worth-special: "<yellow>{item}</yellow> <gray>- the price depends on the type. Check <white>/worth</white> under {category}"
  worth-none: "<red>No item found with that name."
  worth-many: "<gray>{count} items found, be more specific. For example: <white>{list}"
  players-only: "<red>Only players can use this."
  usage-worth: "<red>Usage: /worth [item]"
  language-current: "<gray>Language: <white>{language} <gray>(available: <white>{list}<gray>)"
  language-set: "<green>Language set to <white>{language}<green>."
  language-unknown: "<red>Unknown language. Available: <white>{list}"
  status-title: "<yellow>SellPlugin status"
  status-packetevents: "<gray>PacketEvents found: {state}"
  status-lore: "<gray>Worth tooltip active: {state}"
  status-lore-count: "<gray>Items sent with tooltip: <white>{count}"
  status-last-error: "<gray>Last error: <white>{error}"
  status-creative: "<gray>You in creative (no tooltip): {state}"
  state-yes: "<green>yes"
  state-no: "<red>no"
  state-no-install: "<red>no (install PacketEvents)"
  creative-yes: "<red>yes, switch to survival"
  creative-no: "<green>no"

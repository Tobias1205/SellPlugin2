# SellPlugin - Français
# Tags zoals <green> en placeholders zoals {money} niet aanpassen / do not change tags and {placeholders}.
# Kleine hoofdletters in de menu's worden automatisch toegepast (zie small-caps in config.yml).

categories:
  crops: "Cultures"
  ores: "Minerais"
  mobs: "Butin de mobs"
  natural: "Objets naturels"
  tools: "Armures & Outils"
  fish: "Poissons"
  books: "Livres enchantés"
  potions: "Potions"
  blocks: "Blocs"

worth-lore:
  format: "<!italic><gray>Valeur <green>${price}"

gui:
  sell-title: "<dark_gray>vendre"
  worth-title: "<dark_gray>prix des objets"
  progress-menu-title: "<dark_gray>{category} <dark_gray>progression"
  items-title: "<dark_gray>{category} <dark_gray>objets ({page}/{pages})"
  worth-items-title: "<dark_gray>{category} <dark_gray>prix ({page}/{pages})"
  search-title: "<dark_gray>recherche: {query} ({page}/{pages})"
  history-title: "<dark_gray>historique des ventes ({page}/{pages})"
  multiplier-line: "<!italic><gray>Multiplicateur: <green>x{multiplier}"
  sold-line: "<!italic><gray>Vendu: <green>${sold}"
  next-line: "<!italic><gray>Niveau suivant: <green>x{next} <gray>à <green>${needed}"
  max-line: "<!italic><green>Niveau maximum atteint !"
  progress-line: "<!italic>{bar} <white>{percent}%"
  click-line: "<!italic><yellow>Clique pour voir l'aperçu"
  items-click-line: "<!italic><yellow>Clique pour voir tous les objets"
  level-reached: "<!italic><green>x{multiplier} atteint"
  level-current: "<!italic><yellow>x{multiplier} <gray>(en cours)"
  level-locked: "<!italic><gray>x{multiplier}"
  level-from: "<!italic><gray>Dès <green>${needed} <gray>vendus"
  level-remaining: "<!italic><gray>Encore <green>${remaining} <gray>à vendre"
  back: "<!italic><red>Retour"
  back-overview: "<!italic><red>Retour"
  back-worth: "<!italic><red>Retour"
  close: "<!italic><red>Fermer"
  prev: "<!italic><yellow>Page précédente"
  next: "<!italic><yellow>Page suivante"
  page-info: "<!italic><gray>Page <white>{page}<gray>/<white>{pages}"
  potion-note: "<!italic><dark_gray>Les potions prolongées, améliorées et splash valent plus"
  history-entry-name: "<!italic><yellow>#{number} <dark_gray>- <gray>{date}"
  history-money: "<!italic><gray>Gagné: <green>${money}"
  history-items: "<!italic><gray>Objets: <white>{items}"
  history-mult: "<!italic><gray>Multiplicateur: <green>x{multiplier}"
  history-top-header: "<!italic><gray>Les plus précieux :"
  history-top-line: "<!italic><dark_gray>- <white>{count}x <gray>{item}"
  history-summary-name: "<!italic><yellow>Total"
  history-summary-total: "<!italic><gray>Total gagné: <green>${money}"
  history-summary-sales: "<!italic><gray>Nombre de ventes: <white>{sales}"
  history-empty: "<!italic><gray>Rien de vendu pour l'instant"

messages:
  sold: "<green>Tu as vendu <white>{items}</white> objets pour <yellow>${money}</yellow> <gray>(x{multiplier})"
  category-levelup: "<gold><bold>NIVEAU SUPÉRIEUR !</bold> <white>{category}</white> <yellow>multiplicateur maintenant x{progress}</yellow>"
  no-permission: "<red>Pas de permission."
  reloaded: "<green>Config et prix rechargés."
  multipliers-header: "<green>Tes multiplicateurs <gray>(global x{global})"
  multiplier-line: "<gray>- {category}<gray>: <yellow>x{multiplier} <dark_gray>(niveau x{progress})"
  worth-hand: "<yellow>{item}</yellow> <gray>- Valeur <green>${stack}</green> <dark_gray>(x{multiplier})"
  not-sellable: "<red>Cet objet ne peut pas être vendu."
  hold-item: "<red>Tiens un objet en main."
  global-set: "<green>Le multiplicateur global est maintenant x{multiplier}."
  usage-global: "<red>Utilisation : /sell global [nombre]"
  worth-lookup: "<yellow>{item}</yellow> <gray>- Valeur <green>${price}</green> <dark_gray>({category}<dark_gray>, x{multiplier})"
  worth-special: "<yellow>{item}</yellow> <gray>- le prix dépend du type. Regarde dans <white>/worth</white> sous {category}"
  worth-none: "<red>Aucun objet trouvé avec ce nom."
  worth-many: "<gray>{count} objets trouvés, sois plus précis. Par exemple : <white>{list}"
  players-only: "<red>Seuls les joueurs peuvent utiliser ceci."
  usage-worth: "<red>Utilisation : /worth [objet]"
  language-current: "<gray>Langue : <white>{language} <gray>(disponibles : <white>{list}<gray>)"
  language-set: "<green>Langue réglée sur <white>{language}<green>."
  language-unknown: "<red>Langue inconnue. Disponibles : <white>{list}"
  status-title: "<yellow>Statut de SellPlugin"
  status-packetevents: "<gray>PacketEvents trouvé : {state}"
  status-lore: "<gray>Infobulle de valeur active : {state}"
  status-lore-count: "<gray>Objets envoyés avec infobulle : <white>{count}"
  status-last-error: "<gray>Dernière erreur : <white>{error}"
  status-creative: "<gray>Toi en créatif (pas d'infobulle) : {state}"
  state-yes: "<green>oui"
  state-no: "<red>non"
  state-no-install: "<red>non (installe PacketEvents)"
  creative-yes: "<red>oui, passe en survie"
  creative-no: "<green>non"

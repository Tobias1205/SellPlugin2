# SellPlugin - Deutsch
# Tags zoals <green> en placeholders zoals {money} niet aanpassen / do not change tags and {placeholders}.
# Kleine hoofdletters in de menu's worden automatisch toegepast (zie small-caps in config.yml).
# <theme>...</theme> = kleurverloop uit config.yml (theme-colors). Verhoog lang-version niet zelf.

lang-version: 4

categories:
  crops: "Feldfrüchte"
  ores: "Erze"
  mobs: "Mob-Drops"
  natural: "Natürliche Items"
  tools: "Rüstung & Werkzeuge"
  fish: "Fische"
  books: "Verzauberte Bücher"
  potions: "Tränke"
  blocks: "Blöcke"

worth-lore:
  format: "<!italic><gray>Wert <green>${price}"

gui:
  sell-title: "<dark_gray>verkaufen"
  worth-title: "<dark_gray>itempreise"
  progress-menu-title: "<dark_gray>{category} <dark_gray>fortschritt"
  items-title: "<dark_gray>{category} <dark_gray>items ({page}/{pages})"
  worth-items-title: "<dark_gray>{category} <dark_gray>preise ({page}/{pages})"
  search-title: "<dark_gray>suche: {query} ({page}/{pages})"
  history-title: "<dark_gray>verkaufsverlauf ({page}/{pages})"
  multiplier-line: "<!italic><gray>Multiplikator: <green>x{multiplier}"
  sold-line: "<!italic><gray>Verkauft: <green>${sold}"
  next-line: "<!italic><gray>Nächstes Level: <green>x{next} <gray>bei <green>${needed}"
  max-line: "<!italic><green>Maximales Level erreicht!"
  progress-line: "<!italic>{bar} <white>{percent}%"
  click-line: "<!italic><yellow>Klicke für die Übersicht"
  items-click-line: "<!italic><yellow>Klicke, um alle Items zu sehen"
  level-reached: "<!italic><green>x{multiplier} erreicht"
  level-current: "<!italic><yellow>x{multiplier} <gray>(in Arbeit)"
  level-locked: "<!italic><gray>x{multiplier}"
  level-from: "<!italic><gray>Ab <green>${needed} <gray>verkauft"
  level-remaining: "<!italic><gray>Noch <green>${remaining} <gray>bis dahin"
  back: "<!italic><red>Zurück"
  back-overview: "<!italic><red>Zurück"
  back-worth: "<!italic><red>Zurück"
  close: "<!italic><red>Schließen"
  prev: "<!italic><yellow>Vorherige Seite"
  next: "<!italic><yellow>Nächste Seite"
  page-info: "<!italic><gray>Seite <white>{page}<gray>/<white>{pages}"
  potion-note: "<!italic><dark_gray>Verlängerte, verstärkte und Wurftränke sind mehr wert"
  history-entry-name: "<!italic><yellow>#{number} <dark_gray>- <gray>{date}"
  history-money: "<!italic><gray>Verdient: <green>${money}"
  history-items: "<!italic><gray>Items: <white>{items}"
  history-mult: "<!italic><gray>Multiplikator: <green>x{multiplier}"
  history-top-header: "<!italic><gray>Am wertvollsten:"
  history-top-line: "<!italic><dark_gray>- <white>{count}x <gray>{item}"
  history-summary-name: "<!italic><yellow>Gesamt"
  history-summary-total: "<!italic><gray>Insgesamt verdient: <green>${money}"
  history-summary-sales: "<!italic><gray>Anzahl Verkäufe: <white>{sales}"
  history-empty: "<!italic><gray>Noch nichts verkauft"

messages:
  sold: "<theme>Du hast {items} Items für </theme><#00AA00>${money}</#00AA00><theme> verkauft</theme>"
  category-levelup: "<theme><bold>LEVEL UP!</bold> </theme><white>{category}</white> <theme>Multiplikator ist jetzt x{progress}</theme>"
  no-permission: "<red>Keine Berechtigung."
  reloaded: "<theme>Config und Preise neu geladen.</theme>"
  multipliers-header: "<theme>Deine Multiplikatoren </theme><gray>(global x{global})"
  multiplier-line: "<gray>- {category}<gray>: <theme>x{multiplier} </theme><dark_gray>(Level x{progress})"
  worth-hand: "<theme>{item}</theme> <gray>- Wert <theme>${stack}</theme> <dark_gray>(x{multiplier})"
  not-sellable: "<red>Dieses Item kann nicht verkauft werden."
  hold-item: "<red>Halte ein Item in der Hand."
  global-set: "<theme>Globaler Multiplikator ist jetzt x{multiplier}.</theme>"
  usage-global: "<red>Benutzung: /sell global [Zahl]"
  worth-lookup: "<theme>{item}</theme> <gray>- Wert <theme>${price}</theme> <dark_gray>({category}<dark_gray>, x{multiplier})"
  worth-special: "<theme>{item}</theme> <gray>- der Preis hängt vom Typ ab. Schau in <white>/worth</white> unter {category}"
  worth-none: "<red>Kein Item mit diesem Namen gefunden."
  worth-many: "<gray>{count} Items gefunden, sei genauer. Zum Beispiel: <white>{list}"
  players-only: "<red>Das können nur Spieler benutzen."
  usage-worth: "<red>Benutzung: /worth [Item]"
  language-current: "<gray>Sprache: <white>{language} <gray>(verfügbar: <white>{list}<gray>)"
  language-set: "<theme>Sprache auf </theme><white>{language}<theme> gestellt.</theme>"
  language-unknown: "<red>Unbekannte Sprache. Verfügbar: <white>{list}"
  status-title: "<theme>SellPlugin Status</theme>"
  status-packetevents: "<gray>PacketEvents gefunden: {state}"
  status-lore: "<gray>Wert-Tooltip aktiv: {state}"
  status-lore-count: "<gray>Items mit Tooltip gesendet: <white>{count}"
  status-last-error: "<gray>Letzter Fehler: <white>{error}"
  status-creative: "<gray>Du im Kreativmodus (kein Tooltip): {state}"
  state-yes: "<green>ja"
  state-no: "<red>nein"
  state-no-install: "<red>nein (installiere PacketEvents)"
  creative-yes: "<red>ja, wechsle in den Überlebensmodus"
  creative-no: "<green>nein"

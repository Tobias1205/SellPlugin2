# SellPlugin - Español
# Tags zoals <green> en placeholders zoals {money} niet aanpassen / do not change tags and {placeholders}.
# Kleine hoofdletters in de menu's worden automatisch toegepast (zie small-caps in config.yml).

categories:
  crops: "Cultivos"
  ores: "Minerales"
  mobs: "Botín de mobs"
  natural: "Objetos naturales"
  tools: "Armaduras y herramientas"
  fish: "Peces"
  books: "Libros encantados"
  potions: "Pociones"
  blocks: "Bloques"

worth-lore:
  format: "<!italic><gray>Valor <green>${price}"

gui:
  sell-title: "<dark_gray>vender"
  worth-title: "<dark_gray>precios de objetos"
  progress-menu-title: "<dark_gray>{category} <dark_gray>progreso"
  items-title: "<dark_gray>{category} <dark_gray>objetos ({page}/{pages})"
  worth-items-title: "<dark_gray>{category} <dark_gray>precios ({page}/{pages})"
  search-title: "<dark_gray>búsqueda: {query} ({page}/{pages})"
  history-title: "<dark_gray>historial de ventas ({page}/{pages})"
  multiplier-line: "<!italic><gray>Multiplicador: <green>x{multiplier}"
  sold-line: "<!italic><gray>Vendido: <green>${sold}"
  next-line: "<!italic><gray>Siguiente nivel: <green>x{next} <gray>en <green>${needed}"
  max-line: "<!italic><green>¡Nivel máximo alcanzado!"
  progress-line: "<!italic>{bar} <white>{percent}%"
  click-line: "<!italic><yellow>Haz clic para ver el resumen"
  items-click-line: "<!italic><yellow>Haz clic para ver todos los objetos"
  level-reached: "<!italic><green>x{multiplier} alcanzado"
  level-current: "<!italic><yellow>x{multiplier} <gray>(en curso)"
  level-locked: "<!italic><gray>x{multiplier}"
  level-from: "<!italic><gray>Desde <green>${needed} <gray>vendidos"
  level-remaining: "<!italic><gray>Faltan <green>${remaining}"
  back: "<!italic><red>Atrás"
  back-overview: "<!italic><red>Atrás"
  back-worth: "<!italic><red>Atrás"
  close: "<!italic><red>Cerrar"
  prev: "<!italic><yellow>Página anterior"
  next: "<!italic><yellow>Página siguiente"
  page-info: "<!italic><gray>Página <white>{page}<gray>/<white>{pages}"
  potion-note: "<!italic><dark_gray>Las pociones extendidas, mejoradas y arrojadizas valen más"
  history-entry-name: "<!italic><yellow>#{number} <dark_gray>- <gray>{date}"
  history-money: "<!italic><gray>Ganado: <green>${money}"
  history-items: "<!italic><gray>Objetos: <white>{items}"
  history-mult: "<!italic><gray>Multiplicador: <green>x{multiplier}"
  history-top-header: "<!italic><gray>Más valiosos:"
  history-top-line: "<!italic><dark_gray>- <white>{count}x <gray>{item}"
  history-summary-name: "<!italic><yellow>Total"
  history-summary-total: "<!italic><gray>Total ganado: <green>${money}"
  history-summary-sales: "<!italic><gray>Número de ventas: <white>{sales}"
  history-empty: "<!italic><gray>Aún no has vendido nada"

messages:
  sold: "<green>Has vendido <white>{items}</white> objetos por <yellow>${money}</yellow> <gray>(x{multiplier})"
  category-levelup: "<gold><bold>¡SUBIDA DE NIVEL!</bold> <white>{category}</white> <yellow>el multiplicador ahora es x{progress}</yellow>"
  no-permission: "<red>Sin permiso."
  reloaded: "<green>Config y precios recargados."
  multipliers-header: "<green>Tus multiplicadores <gray>(global x{global})"
  multiplier-line: "<gray>- {category}<gray>: <yellow>x{multiplier} <dark_gray>(nivel x{progress})"
  worth-hand: "<yellow>{item}</yellow> <gray>- Valor <green>${stack}</green> <dark_gray>(x{multiplier})"
  not-sellable: "<red>Este objeto no se puede vender."
  hold-item: "<red>Sostén un objeto."
  global-set: "<green>El multiplicador global ahora es x{multiplier}."
  usage-global: "<red>Uso: /sell global [número]"
  worth-lookup: "<yellow>{item}</yellow> <gray>- Valor <green>${price}</green> <dark_gray>({category}<dark_gray>, x{multiplier})"
  worth-special: "<yellow>{item}</yellow> <gray>- el precio depende del tipo. Mira en <white>/worth</white> en {category}"
  worth-none: "<red>No se encontró ningún objeto con ese nombre."
  worth-many: "<gray>{count} objetos encontrados, sé más específico. Por ejemplo: <white>{list}"
  players-only: "<red>Solo los jugadores pueden usar esto."
  usage-worth: "<red>Uso: /worth [objeto]"
  language-current: "<gray>Idioma: <white>{language} <gray>(disponibles: <white>{list}<gray>)"
  language-set: "<green>Idioma establecido en <white>{language}<green>."
  language-unknown: "<red>Idioma desconocido. Disponibles: <white>{list}"
  status-title: "<yellow>Estado de SellPlugin"
  status-packetevents: "<gray>PacketEvents encontrado: {state}"
  status-lore: "<gray>Tooltip de valor activo: {state}"
  status-lore-count: "<gray>Objetos enviados con tooltip: <white>{count}"
  status-last-error: "<gray>Último error: <white>{error}"
  status-creative: "<gray>Tú en creativo (sin tooltip): {state}"
  state-yes: "<green>sí"
  state-no: "<red>no"
  state-no-install: "<red>no (instala PacketEvents)"
  creative-yes: "<red>sí, cambia a supervivencia"
  creative-no: "<green>no"
